# Creates the draft release and uploads its platform declaration and Agent Skills archives.
name: Release staging

on:
  workflow_call:
    inputs:
      selection:
        required: true
        type: string
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      release_id:
        value: ${{ jobs.create-release.outputs.release_id }}

permissions: {}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: release
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release_inputs.outputs.version }}
      tag: ${{ steps.release_inputs.outputs.tag }}
      release_id: ${{ steps.staged_release.outputs.release_id }}
    steps:
      - name: Publish release inputs
        id: release_inputs
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          {
            printf 'version=%s\n' "$RELEASE_VERSION"
            printf 'tag=%s\n' "$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Refuse to re-draft a published release
        id: stage_target
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_inputs.outputs.tag }}
        run: node scripts/release/stage-target.mjs --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Create staged release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release_inputs.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release_inputs.outputs.version }}
          STAGE_STATE: ${{ steps.stage_target.outputs.state }}
        run: |
          set -euo pipefail

          notes_file="$(mktemp)"
          node scripts/release/release-notes.mjs --version "$RELEASE_VERSION" --out "$notes_file"

          # An existing draft at this tag already carries these notes; it is never edited, so a release
          # published mid-run can never be flipped back to draft here.
          if [ "$STAGE_STATE" = "draft" ]; then
            printf 'Reusing the existing draft release for %s.\n' "$RELEASE_TAG"
          elif [ "$STAGE_STATE" = "none" ]; then
            gh release create "$RELEASE_TAG" \
              --title "JobSentinel $RELEASE_VERSION" \
              --draft \
              --verify-tag \
              --notes-file "$notes_file"
          else
            printf 'Unknown staging state: %s\n' "$STAGE_STATE"
            exit 1
          fi

      - name: Resolve staged draft release id
        id: staged_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_inputs.outputs.tag }}
        run: node scripts/release/stage-target.mjs --require-draft --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

  package-agent-skills:
    needs: create-release
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment:
      name: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: node scripts/harness/npm-pin.mjs

      - name: Package Agent Skills
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: npm run release:skills -- --version "$RELEASE_VERSION" --out-dir release-assets/public

      - name: Write release platform declaration
        env:
          RELEASE_SELECTION: ${{ inputs.selection }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: >-
          node scripts/release/release-platforms.mjs
          --selection "$RELEASE_SELECTION"
          --version "$RELEASE_VERSION"
          --tag "$RELEASE_TAG"
          --revision "$GITHUB_SHA"
          --out-dir release-assets/public

      - name: Attest release platform declaration provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/public/JobSentinel-${{ needs.create-release.outputs.version }}-release-platforms.json

      - name: Attest Agent Skills tarball provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/public/JobSentinel-${{ needs.create-release.outputs.version }}-agent-skills.tar.gz

      - name: Attest Agent Skills ZIP provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-assets/public/JobSentinel-${{ needs.create-release.outputs.version }}-agent-skills.zip

      - name: Upload Agent Skills archives and platform declaration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail

          assets=(
            "release-assets/public/JobSentinel-$RELEASE_VERSION-agent-skills.tar.gz"
            "release-assets/public/JobSentinel-$RELEASE_VERSION-agent-skills.tar.gz.sha256"
            "release-assets/public/JobSentinel-$RELEASE_VERSION-agent-skills.zip"
            "release-assets/public/JobSentinel-$RELEASE_VERSION-agent-skills.zip.sha256"
            "release-assets/public/JobSentinel-$RELEASE_VERSION-release-platforms.json"
            "release-assets/public/JobSentinel-$RELEASE_VERSION-release-platforms.json.sha256"
          )

          for asset in "${assets[@]}"; do
            if [ ! -s "$asset" ]; then
              printf 'Expected release asset or checksum before upload: %s\n' "$asset"
              exit 1
            fi
          done

          # Re-checks by id that the release is still this tag's draft, then replaces and uploads by release id.
          node scripts/release/draft-assets.mjs upload --repo "$GITHUB_REPOSITORY" \
            --release-id "$RELEASE_ID" --tag "$RELEASE_TAG" --tag-commit "$GITHUB_SHA" -- "${assets[@]}"

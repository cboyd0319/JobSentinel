# Verifies a published v3+ release anonymously against its declared platform set and revision.
# Manual only: all-local releases are verified locally, or here with their selection named.
name: Verify Release Artifacts

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (v3.0.0 or later) to verify. Blank selects the latest public release, which fails if it predates v3 platform declarations.
        required: false
        type: string
      require_gatekeeper:
        description: Require Gatekeeper acceptance. Use only for Developer ID signed and notarized macOS releases.
        required: false
        default: false
        type: boolean
      platforms:
        description: Optional comma-separated platforms. Blank uses the release's verified declaration; a value must match it exactly.
        required: false
        default: ""
        type: string
      evidence_ref:
        description: Optional evidence commit E; when set, public downloads must match its certified digests.
        required: false
        default: ""
        type: string
      selection:
        description: Release selection the declaration must equal. Required as "local" for an all-local release.
        required: false
        default: ""
        type: string
      require_windows_unsigned_label:
        description: Require Windows installer filenames to include _unsigned for no-account releases.
        required: false
        default: true
        type: boolean

permissions: {}

jobs:
  verify-public-release-assets:
    name: Verify public release assets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      attestations: read
      contents: read
    outputs:
      tag: ${{ steps.verify_public.outputs.tag }}
      macos_source: ${{ steps.verify_public.outputs.macos_source }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: node scripts/harness/npm-pin.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Verify public release asset set
        id: verify_public
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_SELECTION: ${{ inputs.selection }}
          DISPATCH_PLATFORMS: ${{ inputs.platforms }}
          DISPATCH_EVIDENCE_REF: ${{ inputs.evidence_ref }}
          DISPATCH_REQUIRE_WINDOWS_UNSIGNED_LABEL: ${{ inputs.require_windows_unsigned_label }}
          VAR_REQUIRE_WINDOWS_UNSIGNED_LABEL: ${{ vars.JOBSENTINEL_WINDOWS_REQUIRE_UNSIGNED_LABEL }}
          # API metadata reads and gh attestation only; asset downloads are always anonymous.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(--require-supply-chain --repo "$GITHUB_REPOSITORY" --github-output "$GITHUB_OUTPUT")
          if [ -n "${DISPATCH_TAG:-}" ]; then
            args+=(--tag "$DISPATCH_TAG")
          fi
          if [ -n "${DISPATCH_SELECTION:-}" ]; then
            args+=(--selection "$DISPATCH_SELECTION")
          fi

          if [ -n "${DISPATCH_PLATFORMS:-}" ]; then
            args+=(--platforms "$DISPATCH_PLATFORMS")
          fi
          if [ -n "${DISPATCH_EVIDENCE_REF:-}" ]; then
            args+=(--evidence-revision "$DISPATCH_EVIDENCE_REF")
          fi

          require_windows_unsigned_label="${VAR_REQUIRE_WINDOWS_UNSIGNED_LABEL:-true}"
          if [ -n "${DISPATCH_REQUIRE_WINDOWS_UNSIGNED_LABEL:-}" ]; then
            require_windows_unsigned_label="$DISPATCH_REQUIRE_WINDOWS_UNSIGNED_LABEL"
          fi
          if [ "$require_windows_unsigned_label" = "true" ]; then
            args+=(--require-windows-unsigned-label)
          fi

          npm run release:verify:public -- "${args[@]}"

  verify-macos-public-artifact:
    name: Verify public macOS DMG
    needs: verify-public-release-assets
    if: needs.verify-public-release-assets.outputs.macos_source == 'hosted' || needs.verify-public-release-assets.outputs.macos_source == 'local'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      attestations: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          package-manager-cache: false

      - name: Install pinned npm
        run: node scripts/harness/npm-pin.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund

      - name: Verify public macOS release artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.verify-public-release-assets.outputs.tag }}
          MACOS_SOURCE: ${{ needs.verify-public-release-assets.outputs.macos_source }}
          REQUIRE_GATEKEEPER: ${{ inputs.require_gatekeeper || vars.JOBSENTINEL_MACOS_REQUIRE_GATEKEEPER || 'false' }}
          # API metadata reads and gh attestation only; the DMG download is anonymous.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          args=(--tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY")
          if [ "${REQUIRE_GATEKEEPER:-false}" = "true" ]; then
            args+=(--require-gatekeeper)
          fi
          # A locally built DMG has no hosted provenance; the public asset job verified its SBOM and checksum.
          if [ "$MACOS_SOURCE" = "hosted" ]; then
            args+=(--require-supply-chain)
          else
            args+=(--no-require-supply-chain)
          fi

          npm run tauri:verify:macos:latest -- "${args[@]}"

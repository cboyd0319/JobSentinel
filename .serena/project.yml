# Configures JobSentinel semantic navigation; AGENTS.md owns the working contract.
project_name: JobSentinel
language_servers:
- rust
- typescript
- bash
- powershell
- toml
- yaml
- json
language_backend: LSP
agent_interface: tools
encoding: utf-8
line_ending: lf
ignore_all_files_in_gitignore: true
ls_workspace_folders:
- "."
ignored_paths:
- "src-tauri/gen/**"
read_only: false
activation_command:
ls_specific_settings:
  rust:
    initializationOptions:
      checkOnSave: false
initial_prompt: >-
  Read the root AGENTS.md and closest scoped instructions. Use bounded symbol and
  reference queries; use text search for unsupported languages and LSP coverage gaps.
  Never activate another root on a server shared with another agent.
default_modes:
added_modes:
included_apis: []
excluded_apis: []
excluded_tools: []
included_optional_tools: []
fixed_tools: []
symbol_info_budget:
read_only_memory_patterns: []
ignored_memory_patterns: []
ls_additional_workspace_folders: []
activation_command_timeout: 180.0
